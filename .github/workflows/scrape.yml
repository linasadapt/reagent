name: Scrape real estate listings

permissions:
  contents: write

on:
  schedule:
    # every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sotheby's scrapers
        run: |
          python sothebys.py
          python sothebys_houses.py

      - name: Run Michael Zingraf scrapers
        run: |
          python michaelzingraf.py
          python michaelzingraf_houses.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add results.json
          git diff --cached --quiet || git commit -m "Update results.json"
          git push
